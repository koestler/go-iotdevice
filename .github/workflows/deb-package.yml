name: Debian Package

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

env:
  NFPM_VERSION: v2.48.0

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64, armhf]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'

      - uses: actions/setup-node@v7
        with:
          node-version: 25

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}

      - name: Shellcheck
        run: shellcheck packaging/deb/*.sh packaging/deb/scripts/*.sh

      - name: Build package
        run: |
          VERSION=$(packaging/deb/version.sh)
          echo "version=$VERSION"
          packaging/deb/build-deb.sh "${{ matrix.arch }}" "$VERSION"

      - name: Checksum
        working-directory: dist
        run: sha256sum go-iotdevice_*.deb > "SHA256SUMS-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: |
            dist/go-iotdevice_*.deb
            dist/SHA256SUMS-*

  verify:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: deb-amd64
          path: dist

      - name: Lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on error --suppress-tags statically-linked-binary,no-manual-page,no-changelog,changelog-file-missing-in-native-package,unstripped-binary-or-object dist/*.deb

      - name: Install test in a systemd container
        run: packaging/deb/test-install.sh dist/go-iotdevice_*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Create SHA256SUMS
        working-directory: dist
        run: cat SHA256SUMS-* | sort -k2 > SHA256SUMS && rm SHA256SUMS-*

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --clobber
