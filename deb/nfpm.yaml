name: go-iotdevice
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Lorenz Koestler <lorenz@koestler.ch>
homepage: https://github.com/koestler/go-iotdevice
license: MIT
description: |
  Reads parameters from Victron Energy devices, Modbus, GPIO, HTTP and MQTT
  devices and exposes them via a web interface, a REST API and MQTT.
recommends:
  - pwgen
  - apache2-utils
deb:
  compression: xz
contents:
  - src: dist/${ARCH}/go-iotdevice
    dst: /usr/bin/go-iotdevice
    expand: true
    file_info:
      mode: 0755
  - src: dist/frontend-build/
    dst: /usr/share/go-iotdevice/frontend-build/
    type: tree
  - src: docs/swagger.html
    dst: /usr/share/go-iotdevice/docs/swagger.html
    file_info:
      mode: 0644
  - src: docs/swagger.json
    dst: /usr/share/go-iotdevice/docs/swagger.json
    file_info:
      mode: 0644
  - src: docs/swagger.yaml
    dst: /usr/share/go-iotdevice/docs/swagger.yaml
    file_info:
      mode: 0644
  - src: deb/config.yaml
    dst: /etc/go-iotdevice/config.yaml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: go-iotdevice
  - src: deb/go-iotdevice.service
    dst: /usr/lib/systemd/system/go-iotdevice.service
    file_info:
      mode: 0644
  - src: documentation/full-config.yaml
    dst: /usr/share/doc/go-iotdevice/full-config.yaml
    file_info:
      mode: 0644
  - src: documentation/config.yaml
    dst: /usr/share/doc/go-iotdevice/config.yaml.example
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/go-iotdevice/copyright
    file_info:
      mode: 0644
  - src: dist/changelog.gz
    dst: /usr/share/doc/go-iotdevice/changelog.gz
    file_info:
      mode: 0644
scripts:
  preinstall: deb/scripts/preinst.sh
  postinstall: deb/scripts/postinst.sh
  preremove: deb/scripts/prerm.sh
  postremove: deb/scripts/postrm.sh
